name: CWA Typhoon Warning Data Pipeline

on:
  push:
      branches:
        - feature/typhoon-pipeline
  schedule:
    # 颱風季時可以開啟：每 3 小時執行一次 (UTC 0, 3, 6, 9, 12, 15, 18, 21)
    # 台灣時間為 08, 11, 14, 17, 20, 23, 02, 05，剛好契合氣象署警報更新頻率
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OUTPUT_BRANCH: typhoon_outputs

jobs:
  download_raw_typhoon:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CWA Typhoon Warning
        env:
          CWA_OPEN_API_TOKEN: ${{ secrets.CWA_OPEN_API_TOKEN_HYH }}
        run: |
          set -euo pipefail

          # 抓取 W-C0034-005 颱風警報單 JSON 檔
          curl -fL -G "https://opendata.cwa.gov.tw/api/v1/rest/datastore/W-C0034-005" \
            --data-urlencode "Authorization=${CWA_OPEN_API_TOKEN}" \
            --data-urlencode "downloadType=WEB" \
            --data-urlencode "format=JSON" \
            -o W-C0034-005.json

      - name: Upload downloaded files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-cwa_typhoon-files
          path: |
            W-C0034-005.json

  ai_report_and_upload:
    runs-on: ubuntu-22.04
    needs: download_raw_typhoon
    env:
      GEMINI_API_KEY: ${{ secrets['GEMINI_API_KEY_RAMELA'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download raw files artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-cwa_typhoon-files
          path: .

      - name: Simplify Typhoon Data
        run: |
          set -euo pipefail

          python simplify_typhoon_data_t.py \
            --input W-C0034-005.json \
            --output W-C0034-005-SP.json

      - name: Upload simplified files artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplified-cwa_typhoon-files
          path: |
            W-C0034-005-SP.json

      - name: Generate Typhoon descriptions by AI
        run: |
          set -euo pipefail

          python typhoon_ai_writer_t.py \
            --typhoon-file W-C0034-005-SP.json \
            --output typhoon_warning_report_t.txt \
            --model gemini-3.5-flash

      - name: Upload AI report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-typhoon-report
          path: |
            typhoon_warning_report_t.txt

      - name: Get Current Date (Taiwan Time)
        id: get_date
        run: |
          # 預設 GitHub 伺服器是 UTC 時間，加上 TZ 確保抓到正確的台灣日期
          echo "today=$(TZ=Asia/Taipei date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Deploy Only AI Report to Lab Server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.LAB_SERVER_USER }}
          host: ${{ secrets.LAB_SERVER_HOST }}
          port: ${{ secrets.LAB_SERVER_PORT }}
          ssh_private_key: ${{ secrets.LAB_SERVER_SSH_KEY }}
          
          # 指定只傳送這一個檔案
          local_path: './typhoon_warning_report_t.txt'
          
          # 👈 動態拼接日期變數（請將前面改成你實驗室的基礎絕對路徑）
          remote_path: '/mnt/c/Users/RadarLab/Documents/taoyuan_weather/${{ steps.get_date.outputs.today }}/'

  commit_generated_files:
    runs-on: ubuntu-22.04
    needs:
      - download_raw_typhoon
      - ai_report_and_upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OUTPUT_BRANCH }}
          fetch-depth: 0

      - name: Download raw files artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-cwa_typhoon-files
          path: .

      - name: Download simplified files artifact
        uses: actions/download-artifact@v4
        with:
          name: simplified-cwa_typhoon-files
          path: .

      - name: Download AI report artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-typhoon-report
          path: .

      - name: Commit generated files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            W-C0034-005.json \
            W-C0034-005-SP.json \
            typhoon_warning_report_t.txt

          if git diff --cached --quiet; then
            echo "No generated file changes to commit"
            exit 0
          fi

          git commit -m "[skip ci] chore: update CWA typhoon data and AI report"
          git push origin HEAD:${OUTPUT_BRANCH}
