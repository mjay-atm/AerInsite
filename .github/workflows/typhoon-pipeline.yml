name: CWA Typhoon Warning Data Pipeline

on:
  push:
      branches:
        - feature/typhoon-pipeline
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OUTPUT_BRANCH: downloads_and_outputs

jobs:
  download_raw_typhoon:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CWA Typhoon Warning
        env:
          CWA_OPEN_API_TOKEN: ${{ secrets.CWA_OPEN_API_TOKEN_HYH }}
        run: |
          set -euo pipefail

          # 抓取 W-C0034-001 颱風警報單 JSON 檔
          curl -fL -G "https://opendata.cwa.gov.tw/api/v1/rest/datastore/W-C0034-001" \
            --data-urlencode "Authorization=${CWA_OPEN_API_TOKEN}" \
            --data-urlencode "downloadType=WEB" \
            --data-urlencode "format=JSON" \
            -o W-C0034-001.json
          # 抓取 W-C0034-005 颱風路徑 JSON 檔
          curl -fL -G "https://opendata.cwa.gov.tw/api/v1/rest/datastore/W-C0034-005" \
            --data-urlencode "Authorization=${CWA_OPEN_API_TOKEN}" \
            --data-urlencode "downloadType=WEB" \
            --data-urlencode "format=JSON" \
            -o W-C0034-005.json

      - name: Upload downloaded files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-cwa_typhoon-files
          path: |
            W-C0034-001.json
            W-C0034-005.json

  ai_report_and_upload:
    runs-on: ubuntu-22.04
    needs: download_raw_typhoon
    env:
      GEMINI_API_KEY: ${{ secrets['GEMINI_API_KEY_RAMELA'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download raw files artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-cwa_typhoon-files
          path: .

      - name: Simplify Typhoon Data
        run: |
          set -euo pipefail

          python simplify_typhoon_data.py \
            --input W-C0034-001.json \
            --output W-C0034-001-SP.json

          python simplify_typhoon_data_t.py \
            --input W-C0034-005.json \
            --output W-C0034-005-SP.json

      - name: Upload simplified files artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplified-cwa_typhoon-files
          path: |
            W-C0034-001-SP.json
            W-C0034-005-SP.json

      - name: Generate Typhoon descriptions by AI
        run: |
          set -euo pipefail

          python typhoon_ai_writer.py \
            --typhoon-file W-C0034-001-SP.json \
            --output typhoon_warning_report.txt

          python typhoon_ai_writer_t.py \
            --typhoon-file W-C0034-005-SP.json \
            --output typhoon_warning_report_t.txt

      - name: Upload AI report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-typhoon-report
          path: |
            typhoon_warning_report*.txt

  commit_generated_files:
    runs-on: ubuntu-22.04
    needs:
      - download_raw_typhoon
      - ai_report_and_upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OUTPUT_BRANCH }}
          fetch-depth: 0

      - name: Download raw files artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-cwa_typhoon-files
          path: .

      - name: Download simplified files artifact
        uses: actions/download-artifact@v4
        with:
          name: simplified-cwa_typhoon-files
          path: .

      - name: Download AI report artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-typhoon-report
          path: .

      - name: Commit generated files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add W-C0034-*.json typhoon_warning_report*.txt

          if git diff --cached --quiet; then
            echo "No generated file changes to commit"
            exit 0
          fi

          git commit -m "[skip ci] chore: update CWA typhoon data and AI report"
          git push origin HEAD:${OUTPUT_BRANCH}
