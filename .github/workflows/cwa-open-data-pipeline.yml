name: CWA Open Data Pipeline

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OUTPUT_BRANCH: downloads_and_outputs

jobs:
  download_and_upload_raw:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CWA files
        env:
          CWA_OPEN_API_TOKEN: ${{ secrets.CWA_OPEN_API_TOKEN }}
        run: |
          set -euo pipefail

          curl -fL "https://cwaopendata.s3.ap-northeast-1.amazonaws.com/Forecast/F-C0032-031.FW50" \
            -o F-C0032-031.FW50

          curl -fL "https://cwaopendata.s3.ap-northeast-1.amazonaws.com/Forecast/F-C0044-001.FW01" \
            -o F-C0044-001.FW01

          curl -fL -G "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/F-A0010-001" \
            --data-urlencode "Authorization=${CWA_OPEN_API_TOKEN}" \
            --data-urlencode "downloadType=WEB" \
            --data-urlencode "format=JSON" \
            -o F-A0010-001.json

          curl -fL -G "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/F-C0032-022" \
            --data-urlencode "Authorization=${CWA_OPEN_API_TOKEN}" \
            --data-urlencode "downloadType=WEB" \
            --data-urlencode "format=JSON" \
            -o F-C0032-022.json

          curl -fL -G "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/F-D0047-005" \
            --data-urlencode "Authorization=${CWA_OPEN_API_TOKEN}" \
            --data-urlencode "downloadType=WEB" \
            --data-urlencode "format=JSON" \
            -o F-D0047-005.json

      - name: Upload downloaded files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-cwa-files
          path: |
            F-C0032-031.FW50
            F-C0044-001.FW01
            F-A0010-001.json
            F-C0032-022.json
            F-D0047-005.json

  ai_report_and_upload:
    runs-on: ubuntu-22.04
    needs: download_and_upload_raw
    env:
      GEMINI_API_KEY: ${{ secrets['GEMINI_API_KEY'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download raw files artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-cwa-files
          path: .

      - name: Simplify A0010 and D0047 data
        run: |
          set -euo pipefail

          python simplify_A0010_week.py \
            --input F-A0010-001.json \
            --output F-A0010-001-SP.json

          python simplify_d0047_rain_wind.py \
            --input F-D0047-005.json \
            --output F-D0047-005-SP.json

      - name: Upload simplified files artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplified-cwa-files
          path: |
            F-A0010-001-SP.json
            F-D0047-005-SP.json

      - name: Generate weather descriptions by AI
        run: |
          set -euo pipefail

          python weather_ai_writer.py \
            --weather-file F-C0032-031.FW50 \
            F-C0044-001.FW01 \
            F-C0032-022.json \
            F-A0010-001-SP.json \
            F-D0047-005-SP.json \
            --output weather_descriptions_by_ai.txt

      - name: Upload AI report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-weather-report
          path: |
            weather_descriptions_by_ai.txt
            weather_descriptions_by_ai_logic.txt

  commit_generated_files:
    runs-on: ubuntu-22.04
    needs:
      - download_and_upload_raw
      - ai_report_and_upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OUTPUT_BRANCH }}
          fetch-depth: 0

      - name: Download raw files artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-cwa-files
          path: .

      - name: Download simplified files artifact
        uses: actions/download-artifact@v4
        with:
          name: simplified-cwa-files
          path: .

      - name: Download AI report artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-weather-report
          path: .

      - name: Commit generated files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            F-C0032-031.FW50 \
            F-C0044-001.FW01 \
            F-A0010-001.json \
            F-C0032-022.json \
            F-D0047-005.json \
            F-A0010-001-SP.json \
            F-D0047-005-SP.json \
            weather_descriptions_by_ai.txt \
            weather_descriptions_by_ai_logic.txt

          if git diff --cached --quiet; then
            echo "No generated file changes to commit"
            exit 0
          fi

          git commit -m "[skip ci] chore: update CWA open data and AI report"
          git push origin HEAD:${OUTPUT_BRANCH}
